name: RADAR ingest

on:
  push:
    branches: [main]
    paths:
      - 'radar/inbox/curated/*.json'
      - 'radar/inbox/curated/enrichment/*.json'
      - 'scripts/merge_inbox.py'
      - 'scripts/enrichment_common.py'
      - 'scripts/merge_enrichment_patches.py'
      - 'scripts/validate_events.py'
      - 'tests/*.py'
  workflow_dispatch:

concurrency:
  group: radar-ingest
  cancel-in-progress: false

jobs:
  merge-curated-inbox:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge reviewed enrichment patches
        run: python scripts/merge_enrichment_patches.py --all

      - name: Merge curated RADAR inbox
        run: python scripts/merge_inbox.py --all

      - name: Validate canonical RADAR dataset
        run: python scripts/validate_events.py radar/events.json

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Enforce expected ingest changes
        shell: bash
        run: |
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(radar/events\.json|radar/inbox/curated/[^/]+\.json|radar/inbox/curated/enrichment/[^/]+\.json|radar/inbox/processed/[^/]+\.json|radar/inbox/processed/enrichment/[^/]+\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed during RADAR ingest:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit canonical RADAR update
        run: |
          if git diff --quiet; then
            echo 'No RADAR changes to commit.'
            exit 0
          fi
          git config user.name 'listening-notes-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add radar/events.json radar/inbox/curated radar/inbox/processed
          git commit -m 'Merge verified RADAR inbox'
          git push origin HEAD:main
